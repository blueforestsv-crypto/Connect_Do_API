[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connect-do-api"
version = "0.1.0"
description = "Backend API for Connect Do"
requires-python = ">=3.12"

dependencies = [
    "fastapi[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "psycopg[binary]",
    "pwdlib[argon2]",
    "PyJWT",
    "email-validator",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app", "app.*"]
exclude = [
    "alembic",
    "alembic.*",
    "tests",
    "tests.*",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"